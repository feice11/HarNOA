# HarNOA 板级配置模板。busybox sh 与 bash 均可 source。
# 复制为 boards/<厂商>-<代号>/board.conf 后填写。

HN_BOARD=vendor-codename        # 板名
HN_HARDWARE=codename            # 写入 ohos.boot.hardware

# ---- S0 镜像（boot/mkimg.sh，在电脑上使用）----
HN_KERNEL=                      # 已打开 CONFIG_PID_NS 等选项的内核 Image
HN_DTB=                         # 可选：ram 入口需要的 dtb
HN_CMDLINE=""
HN_RAM_HEADER=2                 # ram 入口 boot 头版本
HN_MODULES_DIR=                 # 模块所在目录（modules.list 中路径相对于此）
HN_BUSYBOX=                     # 静态 busybox，放入 ramdisk 作为 /bin/sh

# ---- S1 harnoa-init ----
HN_PART=harnoa                  # 数据分区的 GPT 名字
HN_FS=ext4
HN_MNT=/hn
HN_FAILSAFE_SEC=900             # 超时未就绪重启回 Android，0 关闭

# ---- S2/S3 ----
HN_IMAGES="vendor sys_prod chip_prod"   # 除 system 外要挂的 erofs 镜像（$HN_MNT/img/<名>.img）
HN_IPC_KO=$HN_MNT/ipc/hn_ipc.ko
HN_BINDER_PREFIX=hn_            # IPC 模块节点前缀：/dev/hn_binder 等
HN_AROOT=                       # 可选：Android vendor 视图，供 bridges 钩子
HN_PROFILE=minimal              # profiles/<名>.list
HN_HOOK_STRICT=0
