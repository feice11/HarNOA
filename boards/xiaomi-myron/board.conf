# 参考板：Redmi K90 Pro Max（myron，SM8850 / canoe）
# 路径沿用该设备上已有的部署布局，便于与现有安装共存。

HN_BOARD=xiaomi-myron
HN_HARDWARE=myron

# ---- S0 ----
# 内核：Android16 6.12 GKI，额外打开 CONFIG_PID_NS（ArkWeb 渲染进程需要）
HN_KERNEL=
HN_DTB=
HN_CMDLINE=""
HN_RAM_HEADER=2
HN_MODULES_DIR=
HN_BUSYBOX=

# ---- S1 ----
HN_PART=unixnu                  # 128 GiB 独立 GPT 分区，ext4
HN_FS=ext4
HN_MNT=/hm
HN_FAILSAFE_SEC=900
HN_STAGE2=harnoa/core/stage2/harnoa.sh

# ---- S2/S3 ----
HN_ROOT=/hm/hmos/root
HN_IMG=/hm/hmos/img
HN_DATA=/hm/hmos/data
HN_IMAGES="vendor sys_prod chip_prod preload cust"
HN_IPC_KO=/hm/hmos/hmos_ipc.ko
HN_BINDER_PREFIX=hmos_
HN_AROOT=/hm/aroot              # Android vendor 只读视图（触摸/Wi-Fi/音频/蓝牙 HAL 桥）
HN_FW=/hm/hmfw                  # 合并的固件目录（无 ueventd，内核直接读）
HN_PROFILE=minimal
HN_HOOK_STRICT=0
